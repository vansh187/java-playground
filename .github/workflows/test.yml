name: Java playground checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve Spring Boot jars
        run: mvn -B -q -f spring-boot/pom.xml dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory="$RUNNER_TEMP/spring-boot-lib"
      - run: npm test
        env:
          SPRING_BOOT_LIB: ${{ runner.temp }}/spring-boot-lib
      - run: docker build -t webnest-java-playground:test .
      - name: Verify image runtimes
        run: |
          docker run --rm --entrypoint java webnest-java-playground:test -version
          docker run --rm --entrypoint javac webnest-java-playground:test -version
          docker run --rm --entrypoint mvn webnest-java-playground:test -version
          docker run --rm --entrypoint sh webnest-java-playground:test -c 'ls "$SPRING_BOOT_LIB"/spring-boot-4.*.jar'
